<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#E84FFF" />
    <title>DRIP CLIENT — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --primary: #e84fff;
        --accent: #ff6ad5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        overflow: hidden;
      }
      .glow {
        position: fixed;
        inset: -30%;
        pointer-events: none;
        background:
          radial-gradient(closest-side at 50% 40%, rgba(232, 79, 255, 0.22), transparent 68%),
          radial-gradient(closest-side at 18% 20%, rgba(255, 106, 213, 0.12), transparent 55%),
          radial-gradient(closest-side at 82% 78%, rgba(214, 0, 255, 0.1), transparent 50%);
        animation: glow 8s ease-in-out infinite alternate;
      }
      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 55% at 50% 45%, #000 20%, transparent 75%);
        opacity: 0.45;
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 22rem;
        width: 100%;
        text-align: center;
        animation: enter 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .logo {
        position: relative;
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto 1.15rem;
        border-radius: 1.35rem;
        background: linear-gradient(
          160deg,
          rgba(232, 79, 255, 0.16),
          rgba(255, 106, 213, 0.06)
        );
        border: 1px solid rgba(251, 191, 36, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 12px 48px rgba(232, 79, 255, 0.2);
        animation: breathe 2.4s ease-in-out infinite;
      }
      .logo::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 1.75rem;
        border: 1px solid rgba(232, 79, 255, 0.35);
        opacity: 0;
        animation: ring 2.2s ease-out infinite;
      }
      .logo svg {
        width: 2.5rem;
        height: 2.5rem;
        display: block;
      }
      .brand {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--primary);
      }
      .code {
        margin: 0.75rem 0 0;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      p.copy {
        margin: 0.75rem 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 0.75rem;
        margin-top: 1.75rem;
        padding: 0.75rem 1.25rem;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #0c0c0e;
        background: var(--primary);
        cursor: pointer;
        width: 100%;
        box-shadow: 0 8px 24px rgba(232, 79, 255, 0.28);
      }
      button:active {
        opacity: 0.9;
        transform: scale(0.98);
      }
      .status {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: var(--muted);
        min-height: 1.25rem;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes glow {
        from {
          transform: scale(1);
          opacity: 0.85;
        }
        to {
          transform: scale(1.06);
          opacity: 1;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-3px) scale(1.03);
        }
      }
      @keyframes ring {
        0% {
          opacity: 0.5;
          transform: scale(0.92);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow,
        .logo,
        .logo::after,
        .card {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 8h14c8.837 0 16 7.163 16 16s-7.163 16-16 16H12V8zm8 8v16h6c4.418 0 8-3.582 8-8s-3.582-8-8-8h-6z"
            fill="url(#dGrad)"
          />
          <defs>
            <linearGradient
              id="dGrad"
              x1="12"
              y1="8"
              x2="36"
              y2="40"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#FF6AD5" />
              <stop offset="1" stop-color="#E84FFF" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <p class="brand">DRIP CLIENT</p>
      <p class="code">Offline</p>
      <h1>You're offline</h1>
      <p class="copy">
        Check your Wi‑Fi or mobile data, then retry. Your keys and wallet stay
        safe on the server.
      </p>
      <button type="button" id="retry">Retry</button>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
    <script>
      function goOnline() {
        document.getElementById("status").textContent = "Reconnecting…";
        window.location.reload();
      }

      document.getElementById("retry").addEventListener("click", goOnline);

      window.addEventListener("online", function () {
        goOnline();
      });
    </script>
  </body>
</html>
